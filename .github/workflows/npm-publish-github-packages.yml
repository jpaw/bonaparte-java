name: Bonaparte npm package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified npm package to GitHub Packages
        type: boolean
        default: false
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [master, 'release/**']
    tags: ['**']
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN_READ_PACKAGES: ${{ secrets.GH_WORKFLOWS_PAT_READ_PACKAGES || secrets.GH_WORKFLOWS_PAT_WRITE_PACKAGES || github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_WORKFLOWS_PAT_READ_PACKAGES || secrets.GH_WORKFLOWS_PAT_WRITE_PACKAGES || github.token }}
      NPM_REGISTRY_URL: https://npm.pkg.github.com
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          registry-url: https://npm.pkg.github.com
          scope: '@arvato-systems-jacs'
      - name: Configure private Maven dependencies
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: '[{ "id": "github-pkgs", "url": "https://maven.pkg.github.com/arvato-systems-jacs/dummy", "snapshots": { "enabled": "true" } }]'
          plugin_repositories: '[{ "id": "github-pkgs", "url": "https://maven.pkg.github.com/arvato-systems-jacs/dummy", "snapshots": { "enabled": "true" } }]'
          servers: |
            [
              { "id": "github-pkgs", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN_READ_PACKAGES}" },
              { "id": "github", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN_READ_PACKAGES}" }
            ]
      - name: Generate models and APIs, build and verify npm package
        run: mvn --batch-mode --no-transfer-progress -U -Dts-api=true -pl bonaparte-api-ts -am clean verify
      - name: Archive verified npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: bonaparte-api-npm
          path: bonaparte-api-ts/target/bonaparte-api-npm.tgz
          if-no-files-found: error
      - name: Publish npm package
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_WORKFLOWS_PAT_WRITE_PACKAGES || github.token }}
        run: mvn --batch-mode --no-transfer-progress -Dts-api=true -pl bonaparte-api-ts frontend:npm@npm-publish